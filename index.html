<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#171a21">

  <!-- ブラウザのアイコン -->
  <link rel="icon" type="image/png" href="icon.png">

  <!-- iPad / iPhone ホーム画面アイコン -->
  <link rel="apple-touch-icon" href="icon.png">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NOVELINK">
  <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

  <title>NOVELINK</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Noto Sans JP",
        sans-serif;
      background: #171a21;
      color: #fff;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    /* =========================
       SPLASH
    ========================= */

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #171a21;
      transition:
        opacity .45s ease,
        visibility .45s ease;
    }

    #splash.hide {
      opacity: 0;
      visibility: hidden;
    }

    .splash-inner {
      text-align: center;
      animation: splashIn .7s ease;
    }

    .splash-logo {
      width: 92px;
      height: 92px;
      margin: auto;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        145deg,
        #6278ed,
        #4054c4
      );
      box-shadow:
        0 20px 50px rgba(0,0,0,.35);
    }

    .splash-logo span {
      font-size: 55px;
      font-weight: 800;
      color: white;
    }

    .splash-title {
      margin-top: 22px;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .splash-sub {
      margin-top: 8px;
      font-size: 12px;
      color: #8e96a8;
      letter-spacing: .12em;
    }

    @keyframes splashIn {
      from {
        opacity: 0;
        transform: scale(.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* =========================
       APP
    ========================= */

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding:
        0 18px
        env(safe-area-inset-right)
        0 env(safe-area-inset-left);
      background: #1d212b;
      border-bottom: 1px solid #2c3240;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #5267d9;
      font-weight: 800;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .header-actions {
      display: flex;
      gap: 7px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      color: #bfc5d2;
      background: #282d38;
    }

    .icon-btn:hover {
      background: #333948;
    }

    /* =========================
       CONTENT
    ========================= */

    .content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding:
        25px
        max(25px, env(safe-area-inset-right))
        40px
        max(25px, env(safe-area-inset-left));
    }

    .page {
      display: none;
      max-width: 1100px;
      margin: auto;
    }

    .page.active {
      display: block;
    }

    .page-title {
      font-size: 28px;
      font-weight: 750;
      margin-bottom: 7px;
    }

    .page-description {
      color: #8991a1;
      font-size: 14px;
      margin-bottom: 25px;
    }

    /* =========================
       HOME
    ========================= */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 26px;
    }

    .stat {
      background: #202530;
      border: 1px solid #2c3240;
      border-radius: 15px;
      padding: 18px;
    }

    .stat-label {
      font-size: 12px;
      color: #858d9e;
    }

    .stat-value {
      margin-top: 8px;
      font-size: 25px;
      font-weight: 700;
    }

    .works-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .work-card {
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #303644;
      background: #202530;
      transition:
        transform .15s ease,
        border-color .15s ease;
      cursor: pointer;
    }

    .work-card:hover {
      transform: translateY(-2px);
      border-color: #5267d9;
    }

    .work-card-title {
      font-size: 17px;
      font-weight: 700;
    }

    .work-card-meta {
      margin-top: 8px;
      font-size: 12px;
      color: #858d9e;
    }

    .progress {
      height: 5px;
      margin-top: 16px;
      overflow: hidden;
      border-radius: 99px;
      background: #303542;
    }

    .progress span {
      display: block;
      width: 48%;
      height: 100%;
      background: #5267d9;
      border-radius: inherit;
    }

    /* =========================
       EDITOR
    ========================= */

    .editor-wrap {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 16px;
      min-height: calc(100vh - 150px);
    }

    .editor-panel,
    .side-panel {
      background: #202530;
      border: 1px solid #303644;
      border-radius: 16px;
    }

    .editor-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-toolbar {
      height: 50px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border-bottom: 1px solid #303644;
      background: #1d212b;
    }

    .tool-btn {
      min-width: 35px;
      height: 34px;
      padding: 0 9px;
      border-radius: 8px;
      background: #282d38;
      color: #c8ced9;
    }

    .tool-btn:hover {
      background: #363c4a;
    }

    #editor {
      flex: 1;
      width: 100%;
      min-height: 500px;
      resize: none;
      border: none;
      outline: none;
      padding: 25px;
      background: #202530;
      color: #e9ecf2;
      font-size: 16px;
      line-height: 2;
    }

    .editor-footer {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      border-top: 1px solid #303644;
      color: #7f8798;
      font-size: 11px;
    }

    /* =========================
       WARNING
    ========================= */

    .warning-box {
      padding: 15px;
    }

    .warning-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .warning {
      margin-bottom: 8px;
      padding: 10px;
      border-left: 3px solid #e34b5f;
      border-radius: 7px;
      background: rgba(227,75,95,.08);
      color: #ff7181;
      font-size: 12px;
      cursor: pointer;
    }

    .warning:hover {
      background: rgba(227,75,95,.15);
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      height: 64px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      gap: 4px;
      padding:
        6px
        max(10px, env(safe-area-inset-right))
        calc(6px + env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
      background: #1d212b;
      border-top: 1px solid #2c3240;
    }

    .nav-btn {
      min-width: 90px;
      border-radius: 10px;
      background: transparent;
      color: #777f90;
    }

    .nav-btn.active {
      background: #2b3140;
      color: #fff;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.65);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(500px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      border-radius: 17px;
      background: #202530;
      border: 1px solid #353b49;
      box-shadow: 0 30px 100px rgba(0,0,0,.5);
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .modal-text {
      color: #aab1be;
      font-size: 14px;
      line-height: 1.8;
    }

    .modal-close {
      margin-top: 20px;
      width: 100%;
      height: 42px;
      border-radius: 9px;
      background: #5267d9;
      color: white;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 750px) {
      .content {
        padding: 18px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .editor-wrap {
        grid-template-columns: 1fr;
      }

      .side-panel {
        display: none;
      }

      .nav-btn {
        min-width: 70px;
      }
    }
  </style>
</head>

<body>

  <!-- SPLASH -->
  <div id="splash">
    <div class="splash-inner">
      <div class="splash-logo">
        <span>N</span>
      </div>

      <div class="splash-title">
        NOVELINK
      </div>

      <div class="splash-sub">
        WRITE YOUR STORY
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="app">

    <header class="header">

      <div class="brand">
        <div class="brand-logo">N</div>
        <div class="brand-name">NOVELINK</div>
      </div>

      <div class="header-actions">
        <button
          class="icon-btn"
          onclick="showShortcutHelp()">
          ?
        </button>

        <button
          class="icon-btn"
          onclick="showSettings()">
          ⚙
        </button>
      </div>

    </header>

    <main class="content">

      <!-- HOME -->
      <section
        id="home"
        class="page active">

        <h1 class="page-title">
          作品
        </h1>

        <p class="page-description">
          あなたの物語を、ここから。
        </p>

        <div class="stats">

          <div class="stat">
            <div class="stat-label">
              作品数
            </div>

            <div class="stat-value">
              3
            </div>
          </div>

          <div class="stat">
            <div class="stat-label">
              総文字数
            </div>

            <div
              class="stat-value"
              id="totalChars">
              12,480
            </div>
          </div>

          <div class="stat">
            <div class="stat-label">
              今日の文字数
            </div>

            <div
              class="stat-value"
              id="todayChars">
              0
            </div>
          </div>

        </div>

        <div class="works-grid">

          <article
            class="work-card"
            onclick="openEditor()">

            <div class="work-card-title">
              午前0時、僕らの名前が消える
            </div>

            <div class="work-card-meta">
              最終編集：今日
            </div>

            <div class="progress">
              <span></span>
            </div>

          </article>

          <article class="work-card">

            <div class="work-card-title">
              新しい物語
            </div>

            <div class="work-card-meta">
              まだ本文がありません
            </div>

            <div class="progress">
              <span style="width:0"></span>
            </div>

          </article>

          <article class="work-card">

            <div class="work-card-title">
              新規作品
            </div>

            <div class="work-card-meta">
              作成する
            </div>

            <div class="progress">
              <span style="width:0"></span>
            </div>

          </article>

        </div>

      </section>


      <!-- EDITOR -->
      <section
        id="editorPage"
        class="page">

        <h1 class="page-title">
          執筆
        </h1>

        <p class="page-description">
          午前0時、僕らの名前が消える
        </p>

        <div class="editor-wrap">

          <div class="editor-panel">

            <div class="editor-toolbar">

              <button
                class="tool-btn"
                onclick="insertText('「」')">
                「」
              </button>

              <button
                class="tool-btn"
                onclick="insertText('『』')">
                『』
              </button>

              <button
                class="tool-btn"
                onclick="insertText('――')">
                ――
              </button>

              <button
                class="tool-btn"
                onclick="insertText('……')">
                ……
              </button>

              <button
                class="tool-btn"
                onclick="saveText()">
                保存
              </button>

            </div>

            <textarea
              id="editor"
              spellcheck="false"
              placeholder="ここから物語を書き始める……"></textarea>

            <div class="editor-footer">

              <span id="saveStatus">
                未保存
              </span>

              <span id="charCount">
                0文字
              </span>

            </div>

          </div>


          <aside class="side-panel">

            <div class="warning-box">

              <div class="warning-title">
                矛盾チェック
              </div>

              <div
                class="warning"
                onclick="showContradiction(
                  '時間設定の矛盾'
                )">
                時間設定の矛盾
              </div>

              <div
                class="warning"
                onclick="showContradiction(
                  '人物設定の矛盾'
                )">
                人物設定の矛盾
              </div>

              <div
                class="warning"
                onclick="showContradiction(
                  '場所設定の矛盾'
                )">
                場所設定の矛盾
              </div>

            </div>

          </aside>

        </div>

      </section>


      <!-- CHARACTERS -->
      <section
        id="characters"
        class="page">

        <h1 class="page-title">
          登場人物
        </h1>

        <p class="page-description">
          物語に登場する人物を管理します。
        </p>

        <div class="works-grid">

          <article class="work-card">

            <div class="work-card-title">
              桐谷 直人
            </div>

            <div class="work-card-meta">
              主人公
            </div>

          </article>

          <article class="work-card">

            <div class="work-card-title">
              神谷 蓮
            </div>

            <div class="work-card-meta">
              主要人物
            </div>

          </article>

        </div>

      </section>

    </main>


    <!-- NAV -->
    <nav class="bottom-nav">

      <button
        class="nav-btn active"
        onclick="changePage('home', this)">
        作品
      </button>

      <button
        class="nav-btn"
        onclick="changePage('editorPage', this)">
        執筆
      </button>

      <button
        class="nav-btn"
        onclick="changePage('characters', this)">
        人物
      </button>

    </nav>

  </div>


  <!-- MODAL -->
  <div
    id="modal"
    class="modal"
    onclick="closeModal(event)">

    <div
      class="modal-box"
      onclick="event.stopPropagation()">

      <div
        id="modalTitle"
        class="modal-title">
      </div>

      <div
        id="modalText"
        class="modal-text">
      </div>

      <button
        class="modal-close"
        onclick="closeModal()">
        閉じる
      </button>

    </div>

  </div>


  <script>

    /* =========================
       STARTUP
    ========================= */

    window.addEventListener(
      "load",
      () => {

        setTimeout(
          () => {
            document
              .getElementById("splash")
              .classList
              .add("hide");
          },
          1100
        );

        loadText();
        updateCount();

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .register("./sw.js")
            .catch(() => {});
        }

      }
    );


    /* =========================
       PAGE
    ========================= */

    function changePage(
      pageId,
      button
    ) {

      document
        .querySelectorAll(".page")
        .forEach(
          page => {
            page.classList.remove("active");
          }
        );

      document
        .getElementById(pageId)
        .classList
        .add("active");

      document
        .querySelectorAll(".nav-btn")
        .forEach(
          btn => {
            btn.classList.remove("active");
          }
        );

      button.classList.add("active");

    }


    function openEditor() {

      const buttons =
        document.querySelectorAll(
          ".nav-btn"
        );

      changePage(
        "editorPage",
        buttons[1]
      );

    }


    /* =========================
       EDITOR
    ========================= */

    const editor =
      document.getElementById("editor");

    editor.addEventListener(
      "input",
      () => {

        updateCount();

        document
          .getElementById("saveStatus")
          .textContent =
          "自動保存中…";

        clearTimeout(
          window.saveTimer
        );

        window.saveTimer =
          setTimeout(
            saveText,
            700
          );

      }
    );


    function saveText() {

      localStorage.setItem(
        "NOVELINK_TEXT",
        editor.value
      );

      localStorage.setItem(
        "NOVELINK_SAVED_AT",
        Date.now()
      );

      document
        .getElementById("saveStatus")
        .textContent =
        "保存済み";

    }


    function loadText() {

      const saved =
        localStorage.getItem(
          "NOVELINK_TEXT"
        );

      if (saved !== null) {
        editor.value = saved;
      }

      updateCount();

    }


    function updateCount() {

      const count =
        editor.value.length;

      document
        .getElementById("charCount")
        .textContent =
        count.toLocaleString()
        + "文字";

    }


    function insertText(text) {

      const start =
        editor.selectionStart;

      const end =
        editor.selectionEnd;

      editor.value =
        editor.value.substring(
          0,
          start
        )
        + text
        + editor.value.substring(
          end
        );

      editor.focus();

      editor.selectionStart =
        start + text.length;

      editor.selectionEnd =
        start + text.length;

      updateCount();

      saveText();

    }


    /* =========================
       KEYBOARD SHORTCUTS
    ========================= */

    document.addEventListener(
      "keydown",
      event => {

        if (
          (event.ctrlKey ||
           event.metaKey)
          && event.key === "s"
        ) {

          event.preventDefault();

          saveText();

        }

        if (
          (event.ctrlKey ||
           event.metaKey)
          && event.key === "Enter"
        ) {

          event.preventDefault();

          insertText("――");

        }

      }
    );


    /* =========================
       MODAL
    ========================= */

    function showContradiction(
      type
    ) {

      const details = {

        "時間設定の矛盾":
          "同じ人物・出来事について、前後の時間関係が一致していない可能性があります。",

        "人物設定の矛盾":
          "人物の年齢、所属、行動などに以前の設定と異なる部分がある可能性があります。",

        "場所設定の矛盾":
          "人物の移動や施設の位置関係に矛盾がある可能性があります。"

      };

      showModal(
        type,
        details[type]
      );

    }


    function showShortcutHelp() {

      showModal(
        "キーボードショートカット",
        "Ctrl / ⌘ + S：保存<br><br>" +
        "Ctrl / ⌘ + Enter：――を挿入"
      );

    }


    function showSettings() {

      showModal(
        "NOVELINK",
        "小説を書くための執筆環境です。"
      );

    }


    function showModal(
      title,
      text
    ) {

      document
        .getElementById("modalTitle")
        .textContent = title;

      document
        .getElementById("modalText")
        .innerHTML = text;

      document
        .getElementById("modal")
        .classList
        .add("show");

    }


    function closeModal() {

      document
        .getElementById("modal")
        .classList
        .remove("show");

    }

  </script>

</body>
</html>
